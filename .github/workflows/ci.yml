# Reusable CI for Loomspark projects (v1). A project calls it from its own workflow;
# see docs/design.md#adopting-the-kit. Checks:
#   verify      the project's own commands (typecheck, test, build...) from its config
#   hard-rules  things that must never land, on every PR and every push to the default branch
#   risk        changed-path tier for PRs, reported as the `pipeline-kit/risk` commit status:
#               tier >= approval.fromTier stays failing until an approver approves. Reruns
#               on reviews, so an approval turns it green without a new push.
#   journeys    PRs only: waits for the preview of the PR's head commit and runs the
#               project's Playwright journeys against it. Passes with nothing to do when
#               the config lists no journeys.
# The caller grants: contents read, pull-requests write (review requests, the risk
# comment), statuses write (the risk status), deployments read (finding the preview).
# Secrets: only for journeys. The caller passes them by name, onto the secrets declared
# below (secrets: PREVIEW_BYPASS_SECRET: ...), never `secrets: inherit`, so GitHub itself
# keeps the project's other secrets away from the kit (ADR 0004). The kit then passes on
# only those listed under secrets.journeys. No host or AI vendor assumed.
name: pipeline-kit CI

on:
  workflow_call:
    inputs:
      config:
        description: Path to the project config.
        type: string
        default: .pipeline/config.yml
    secrets:
      # Keep in step with JOURNEY_SECRET_SLOTS in src/config.ts (a test checks).
      PREVIEW_BYPASS_SECRET:
        description: Optional. Header value that lets journeys through preview protection; the config's previews.headers names it.
        required: false
    outputs:
      risk-tier:
        description: The PR's risk tier (empty for pushes).
        value: ${{ jobs.risk.outputs.tier }}

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: plan
        uses: loomspark/pipeline-kit@v1
        with:
          command: plan
          config: ${{ inputs.config }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: ${{ steps.plan.outputs.node-version-file }}
          cache: ${{ steps.plan.outputs.cache }}
      - name: Install
        env:
          INSTALL: ${{ steps.plan.outputs.install }}
        run: bash -c "$INSTALL"
      - name: Run verify commands
        env:
          COMMANDS: ${{ steps.plan.outputs.commands }}
        run: |
          failed=()
          echo "| Command | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          count=$(jq length <<< "$COMMANDS")
          for ((i = 0; i < count; i++)); do
            name=$(jq -r ".[$i].name" <<< "$COMMANDS")
            run=$(jq -r ".[$i].run" <<< "$COMMANDS")
            echo "::group::$name"
            if bash -c "$run"; then result=passed; else result=failed; failed+=("$name"); fi
            echo "::endgroup::"
            echo "$name: $result"
            echo "| \`$name\` | $result |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error title=verify::Failed: ${failed[*]}"
            exit 1
          fi

  hard-rules:
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: loomspark/pipeline-kit@v1
        with:
          command: hard-rules
          config: ${{ inputs.config }}
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  risk:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    timeout-minutes: 10
    outputs:
      tier: ${{ steps.risk.outputs.tier }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: risk
        uses: loomspark/pipeline-kit@v1
        with:
          command: risk
          config: ${{ inputs.config }}
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          report-status: "true"

  journeys:
    # Every pull_request event, labels included: the caller's concurrency cancels an
    # in-progress run on a new event, and a cancelled check makes `agent merge` refuse
    # until a later run passes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - id: preview
        uses: loomspark/pipeline-kit@v1
        with:
          command: preview
          config: ${{ inputs.config }}
          head: ${{ github.event.pull_request.head.sha }}
      - id: plan
        if: steps.preview.outputs.enabled == 'true'
        uses: loomspark/pipeline-kit@v1
        with:
          command: plan
          config: ${{ inputs.config }}
      - if: steps.preview.outputs.enabled == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: ${{ steps.plan.outputs.node-version-file }}
          cache: ${{ steps.plan.outputs.cache }}
      - name: Install
        if: steps.preview.outputs.enabled == 'true'
        env:
          INSTALL: ${{ steps.plan.outputs.install }}
        run: bash -c "$INSTALL"
      - name: Install the Playwright browser
        if: steps.preview.outputs.enabled == 'true'
        run: npx --no-install playwright install --with-deps chromium
      - name: Run journeys
        if: steps.preview.outputs.enabled == 'true'
        uses: loomspark/pipeline-kit@v1
        with:
          command: journeys
          config: ${{ inputs.config }}
          url: ${{ steps.preview.outputs.url }}
          secrets: ${{ toJSON(secrets) }}
